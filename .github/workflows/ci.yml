                  assert cost["query_service"]["logical_register_bits_upper"] == 1689
                  assert cost["query_service"]["latency_edges"] == 3
                  assert cost["timing_service"]["DSP25x18"] == 4
                  assert cost["new_raw_RAM_bits"] == cost["extra_query_source_ports"] == 0
                  assert s["timing_state_commits"] == s["stored_symbols"]
                  assert s["complete_latency_cycles"] is None and not s["whole_receiver16MSps"]
                  assert all(not v for v in s["cancelled_inflight"].values())
              assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v for k,v in json.loads((p/"manifest.json").read_text()).items())
          p=Path("receiver-diagnostics/timing-handoff-development")
