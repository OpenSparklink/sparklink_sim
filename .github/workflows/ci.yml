--ignore=tests/test_header_word_flow.py --ignore=tests/test_rrc_pair_flow.py --ignore=tests/test_carrier_numeric_validation.py --ignore=tests/test_capture_fine.py --ignore=tests/test_uniform_spline.py --ignore=tests/test_header_word_standard.py --ignore=tests/test_selected_rx.py --ignore=tests/test_normalization_word_flow.py --ignore=tests/test_timing_word_flow.py --ignore=tests/test_score_word_runtime.py --ignore=tests/test_acquisition_flow.py --ignore=tests/test_acquisition_scaled.py --ignore=tests/test_acquisition_bank.py --ignore=tests/test_rank_serial.py --ignore=tests/test_rank_core.py --ignore=tests/test_rank_serial_model.py --ignore=tests/test_coarse_ingress.py --ignore=tests/test_coarse_ingress_model.py --ignore=tests/test_coarse_capture_source.py --ignore=tests/test_coarse_capture_model.py --ignore=tests/test_capture_frame_resources.py --ignore=tests/test_stream_rrc_full14_boundaries.py --cov=nearlink_sdr --cov-report= --cov-fail-under=0 --junitxml=coverage-tests-core.xml --durations=20 >coverage-core.log 2>&1
