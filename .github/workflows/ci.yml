      - name: Verify finite symbol normalization and retain serial full-RX failures
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_normalization_words.py --split development --timing-root receiver-diagnostics/timing-development --capture-root receiver-diagnostics/capture-fine --selected-root receiver-diagnostics/selected-frame --output receiver-diagnostics/normalization-development >normalization-development.log 2>&1 || status=$?
