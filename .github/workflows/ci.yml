                  assert node["state_register_bits_upper"] == 3469 and node["additional_DSP25x18"] == 4
                  assert node["coefficient_ROM_RAMB18_estimate"] == 1 and node["coefficient_ROM_read_ports"] == 2
                  assert node["new_original_source_RAM_bits"] == node["new_source_or_cache_read_ports"] == 0
                  assert cost["new_controller_state_bits"] == 2282  # Original2048 failure retained.
