name: CI

on:
  push:
    branches: [master, codex/psk-timing-tracking]
  workflow_dispatch:
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: make lint

  rust:
    name: Rust Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cd rust && cargo fmt --check

      - name: Clippy lint
        run: cd rust && cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cd rust && cargo test

  test:
    name: Test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.backend == 'rust'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install locked dependencies
        run: uv sync --frozen --group accel
      - name: Build Rust accelerator
        if: matrix.backend == 'rust'
        run: uv run --frozen --no-sync maturin develop --manifest-path rust/Cargo.toml --locked --release 2>&1 | tee build.log
      - name: Verify actual backend
        run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust ${{ matrix.backend == 'rust' && 'yes' || 'no' }} --output backend.json
      - name: Run tests
        env:
          SPARKLINK_TEST_DIAGNOSTICS: receiver-diagnostics
        run: |
          # Keep every case; run the long finite-word integration suite beside
          # the remaining suite to meet the test-duration budget on two cores.
          uv run --frozen --no-sync pytest tests/ --ignore=tests/test_stream_rrc_word.py -v --tb=short --junitxml=report-core.xml >test-core.log 2>&1 &
          core_pid=$!
          uv run --frozen --no-sync pytest tests/test_stream_rrc_word.py -v --tb=short --junitxml=report-front.xml >test-front.log 2>&1 &
          front_pid=$!
          core_status=0
          front_status=0
          wait "$core_pid" || core_status=$?
          wait "$front_pid" || front_status=$?
          cat test-core.log test-front.log
          test "$core_status" -eq 0 && test "$front_status" -eq 0
      - name: Preserve carrier workload and explicit system resource gap
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_carrier_workload.py --output receiver-diagnostics/carrier-workload >carrier-workload.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-workload/workload.json")); assert len(d["cases"]) == 39 and d["whole_system_accepted"] is False and d["format_complex32_validated"] is False'
      - name: Preserve bounded candidate work and queue rejection
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_sync_candidate_work.py --output receiver-diagnostics/sync-candidate-work >sync-candidate-work.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/sync-candidate-work/model.json")); assert len(d["scenarios"]) == 6 and d["whole_system_accepted"] is False; assert all(r["queue"]["dropped_requests"] > 0 for r in d["scenarios"])'
      - name: Preserve coherent confirmation and bounded NCO resource gaps
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_sync_coherent_work.py --output receiver-diagnostics/sync-coherent-work >sync-coherent-work.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/sync-coherent-work/model.json")); assert len(d["scenarios"]) == 3 and d["whole_system_accepted"] is False; assert d["nco_calendars"]["stopped"]["incomplete"]; assert all(r["known_capture_partial_total_bits"] > r["memory_budget_bits"] for r in d["scenarios"])'
      - name: Preserve rejected sync carrier initialization resource scenarios
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_sync_carrier_work.py --output receiver-diagnostics/sync-carrier-work >sync-carrier-work.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/sync-carrier-work/model.json")); assert len(d["scenarios"]) == 6 and d["whole_system_accepted"] is False; assert all(r["known_partial_lower_bits"] > r["budget_bits"] for r in d["scenarios"]); assert not d["coefficient_calendar"]["incomplete"]'
      - name: Preserve bounded capture transport and system resource gap
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_capture_transport.py --output receiver-diagnostics/capture-transport >capture-transport.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/capture-transport/model.json")); assert len(d["scenarios"]) == 36 and d["whole_system_accepted"] is False; assert d["original_capture_budget_still_failed"]; assert d["rrc_word_control"]["additional_word_errors"] == 0; assert all(r["result"]["peak_owned"] <= 3 and r["result"]["peak_source_operations_per_primitive"] <= 2 for r in d["scenarios"])'
      - name: Preserve RRC memory conflicts and bounded LUTRAM candidates
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_rrc_memory.py --output receiver-diagnostics/rrc-memory >rrc-memory.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/rrc-memory/model.json")); assert len(d["scenarios"]) == 23 and d["whole_system_accepted"] is False; assert d["original_budget_still_failed"]; assert all(r["port_candidate_valid"] for r in d["scenarios"] if r["mode"] == "quad"); assert any(not r["port_candidate_valid"] for r in d["scenarios"] if r["mode"] == "dual")'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; p=Path("receiver-diagnostics/rrc-memory"); m=json.loads((p/"manifest.json").read_text()); assert len(m) == 27; assert all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in m.items()); d=json.loads((p/"model.json").read_text()); assert all(r["sha256"] == m[r["file"]] for r in d["scenarios"])'
      - name: Preserve global spline preparation and serial throughput rejection
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_spline_preparation.py --output receiver-diagnostics/spline-preparation >spline-preparation.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/spline-preparation/model.json")); assert d["float_structure_pass"]; assert not d["whole_system_accepted"] and not d["fixed_format_accepted"] and not d["default_rx_changed"]; assert len(d["cost"]["scenarios"]) == 6; assert all(r["report"]["queue_drops"] > 0 for r in d["cost"]["scenarios"] if r["request_interval_samples"] == 32)'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; p=Path("receiver-diagnostics/spline-preparation"); m=json.loads((p/"manifest.json").read_text()); assert all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in m.items())'
      - name: Preserve frozen integer spline and incomplete system gate
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/audit_spline_fixed.py --output receiver-diagnostics/spline-fixed >spline-fixed.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/spline-fixed/model.json")); assert d["node_candidate_accepted"]; assert d["selected_format"] == {"input_bits":18,"coefficient_fraction_bits":14}; assert not d["whole_system_accepted"] and not d["complete_capture_cycle_verified"] and not d["main_rx_default_changed"]; assert d["original_16kib_failure_preserved"] and d["original_rrc_2percent_failure_preserved"]; assert all(r["result"]["queue_drops"] > 0 for r in d["resources"]["scenarios"] if r["request_interval_samples"] == 32)'
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/spline-fixed/model.json")); r=d["resources"]; assert r["combined_information_lower_bits"] > r["original16kib_budget_bits"]; assert r["fourth_owned_raw_slot_bram36"] == 2 and r["four_engine_system_subtotal"] == 103; assert len(d["all_remaining_new_stream_failures"]) == 6'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; p=Path("receiver-diagnostics/spline-fixed"); m=json.loads((p/"manifest.json").read_text()); assert all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in m.items())'
      - name: Preserve value-carrying spline flow and system failures
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_spline_flow.py --output receiver-diagnostics/spline-flow >spline-flow.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/spline-flow/model.json")); assert d["preparation_node_accepted"] and d["development_cases"] == 337 and d["validation_cases"] == 36; assert not d["whole_system_accepted"] and not d["main_rx_default_changed"] and not d["full_interpolation_score_and_feedback_cycle_verified"]; assert all(r["bitexact_arrays"] for r in d["packet_regressions"]); assert d["resources"]["four_engine_ft2_bram36_subtotal"] == 91; assert all(r["result"]["queue_drops"] > 0 for r in d["resources"]["scenarios"] if r["interval"] == 32)'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; p=Path("receiver-diagnostics/spline-flow"); m=json.loads((p/"manifest.json").read_text()); assert all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in m.items())'
      - name: Preserve finite full-word score and rejected serial throughput
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_spline_score.py --output receiver-diagnostics/spline-score >spline-score.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/spline-score/model.json")); assert d["preparation_guard_pass"] and d["node_word_pass"] and d["development_pass"] and d["validation_pass"] and d["old_fixture_success_preserved"]; assert not d["whole_system_accepted"] and not d["resource_gate"] and not d["main_rx_default_changed"] and not d["float_all_range_compatibility_pass"]; assert d["representative_flow"]["cycles"] == 63119 and d["one_peak_service_upper_cycles"] == 63759; assert d["normalization_floor_failures"][-1]["score_error"] > .005; assert all(r["result"]["queue_drops"] == 118 for r in d["scenarios"]); assert len(d["failures"]) == 3'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; p=Path("receiver-diagnostics/spline-score"); m=json.loads((p/"manifest.json").read_text()); assert all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in m.items())'
      - name: Preserve rejected bounded-prefix carrier choices
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/audit_carrier_prefix.py --output receiver-diagnostics/carrier-prefix >carrier-prefix.log 2>&1 || status=$?
          test "$status" -eq 1
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-prefix/model.json")); assert d["rejected"] and not d["held_evaluated"] and not d["default_receiver_changed"]; assert d["summary"]["full"]["full"] == 7 and d["summary"]["prefix128"]["full"] == 6; assert d["summary"]["prefix256"]["bit_errors"] == 3377; assert len(d["original_fixture_success_losses"]) == 6; assert not d["fixedFFT_format_accepted"] and not d["complete16msps_verified"]; assert any(c["prefix_limit"] == 256 and c["complex_word_bits_assumed"] == 64 and c["clock_hz_assumed"] == 200000000 and c["total_bram36"] == 27 for c in d["costs"])'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; p=Path("receiver-diagnostics/carrier-prefix"); m=json.loads((p/"manifest.json").read_text()); assert all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in m.items())'
      - name: Preserve frozen causal carrier validation and open hardware gates
        if: always()
        run: |
          for split in development validation; do
            status=0
            uv run --frozen --no-sync python scripts/audit_carrier_loop.py --split "$split" --output "receiver-diagnostics/carrier-loop-$split" >"carrier-loop-$split.log" 2>&1 || status=$?
            test "$status" -eq 1
          done
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-loop-development/model.json")); assert d["summary"]["full"]["full"] == d["summary"]["medium-head"]["full"] == 5; assert d["summary"]["full"]["bit_errors"] == d["summary"]["medium-head"]["bit_errors"] == 21; assert d["eligible"] == ["medium-head"]; assert not d["gates"]["slow"]["eligible"] and not d["gates"]["medium"]["eligible"] and not d["gates"]["slow-head"]["eligible"]'
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-loop-validation/model.json")); assert d["float_validation_passed"] and d["selected"] == "medium-head"; assert d["summary"]["full"]["full"] == d["summary"]["medium-head"]["full"] == 6; assert d["summary"]["full"]["bit_errors"] == d["summary"]["medium-head"]["bit_errors"] == 7; assert d["independent_node_validation"]["passed"]; assert not d["default_changed"] and not d["complete16msps"] and not d["fixed_datapath_verified"]; assert not d["original_success_losses"] and len(d["failures"]) == 4'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; folders=[Path("receiver-diagnostics/carrier-loop-"+s) for s in ("development","validation")]; assert all(all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in json.loads((p/"manifest.json").read_text()).items()) for p in folders)'
      - name: Preserve integer carrier words and finite resource failures
        if: always()
        run: |
          for split in development validation; do
            status=0
            uv run --frozen --no-sync python scripts/audit_carrier_fixed.py --split "$split" --output "receiver-diagnostics/carrier-fixed-$split" >"carrier-fixed-$split.log" 2>&1 || status=$?
            test "$status" -eq 1
          done
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-fixed-development/model.json")); assert d["summary"]["float"]["full"] == d["summary"]["q10"]["full"] == 6; assert d["summary"]["q10"]["bit_errors"] == 4; assert d["gates"]["q10"]["eligible"] and not d["gates"]["q12"]["eligible"]; assert not d["gates"]["q12"]["numerical_passed"] and d["gates"]["q12"]["saturations"] == 0; assert any(n["phase_peak"] > .02 for n in d["numerical"]["q12"])'
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-fixed-validation/model.json")); assert d["gates"]["q10"]["eligible"] and d["summary"]["q10"]["full"] == d["summary"]["float"]["full"] == 7; assert d["summary"]["q10"]["bit_errors"] == 2 and not d["default_changed"] and not d["complete16msps"]; f=d["flow"]; assert f["cost"]["service_clocks"] == 41 and len(f["scenarios"]) == 10; assert f["depth8_cost"]["logical_bits"]-f["cost"]["logical_bits"] == 224; assert any(r.get("source_batch") == 8 and r.get("input_depth") == 4 and r["resource_packet_invalid"] for r in f["scenarios"]); assert any(r.get("source_batch") == 8 and r.get("input_depth") == 8 and not r["resource_packet_invalid"] for r in f["scenarios"])'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; ps=[Path("receiver-diagnostics/carrier-fixed-"+s) for s in ("development","validation")]; assert all(all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in json.loads((p/"manifest.json").read_text()).items()) for p in ps)'
      - name: Preserve rejected parallel angle carrier and resource boundaries
        if: always()
        run: |
          for split in development validation; do
            status=0
            uv run --frozen --no-sync python scripts/audit_carrier_parallel.py --split "$split" --output "receiver-diagnostics/carrier-parallel-$split" >"carrier-parallel-$split.log" 2>&1 || status=$?
            test "$status" -eq 1
          done
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-parallel-development/model.json")); assert d["gate"]["eligible"]; assert all(s["full"] == 6 and s["bit_errors"] == 6 and s["captures"] == 7 for s in d["summary"].values())'
          uv run --frozen --no-sync python -c 'import json; d=json.load(open("receiver-diagnostics/carrier-parallel-validation/model.json")); assert not d["gate"]["eligible"] and not d["gate"]["success_losses"]; assert all(s["full"] == 7 and s["captures"] == 8 for s in d["summary"].values()); assert d["summary"]["raw18"]["bit_errors"] == 1737 and d["summary"]["q10"]["bit_errors"] == 1709 and d["summary"]["float"]["bit_errors"] == 1742; assert not any(d["gate"]["numerical_passed"].values()) and d["gate"]["saturations"] == 0; assert not d["default_changed"] and not d["whole16msps"]; f=d["flow"]; assert f["cost"]["service_clocks"] == 32; assert any(r["clock"] == 160000000 and r["batch"] == 1 and not r["blocked"] and r["dropped"] == 0 for r in f["scenarios"]); assert any(r["clock"] == 100000000 and r["dropped"] > 0 for r in f["scenarios"])'
          uv run --frozen --no-sync python -c 'import hashlib,json; from pathlib import Path; ps=[Path("receiver-diagnostics/carrier-parallel-"+s) for s in ("development","validation")]; assert all(all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v for k,v in json.loads((p/"manifest.json").read_text()).items()) for p in ps)'
      - name: Upload tests and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.backend }}
          path: |
            report-*.xml
            test-*.log
            build.log
            backend.json
            carrier-workload.log
            sync-candidate-work.log
            sync-coherent-work.log
            sync-carrier-work.log
            capture-transport.log
            rrc-memory.log
            spline-preparation.log
            spline-fixed.log
            spline-flow.log
            spline-score.log
            carrier-prefix.log
            carrier-loop-*.log
            carrier-fixed-*.log
            carrier-parallel-*.log
            receiver-diagnostics/

  optional-sm3:
    name: Optional SM3 algorithms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --extra sm3
      - name: Require optional dependency and actual Python backend
        run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust no --require-sm3 --output backend.json
      - name: Verify independent HMAC vectors and pairing results
        run: uv run --frozen --no-sync pytest tests/test_crypto.py tests/conformance/test_security.py -v --tb=short --junitxml=sm3.xml 2>&1 | tee sm3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-sm3-results
          path: |
            sm3.xml
            sm3.log
            backend.json

  coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust no --output backend.json
      - name: Measure Python coverage
        run: |
          # Each partial suite has incomplete coverage. Enforce the unchanged
          # 90.1% gate only after combining both real coverage data files.
          COVERAGE_FILE=coverage-core.data uv run --frozen --no-sync pytest tests/ --ignore=tests/test_stream_rrc_word.py --cov=nearlink_sdr --cov-report= --cov-fail-under=0 --junitxml=coverage-tests-core.xml >coverage-core.log 2>&1 &
          core_pid=$!
          COVERAGE_FILE=coverage-front.data uv run --frozen --no-sync pytest tests/test_stream_rrc_word.py --cov=nearlink_sdr --cov-report= --cov-fail-under=0 --junitxml=coverage-tests-front.xml >coverage-front.log 2>&1 &
          front_pid=$!
          core_status=0
          front_status=0
          wait "$core_pid" || core_status=$?
          wait "$front_pid" || front_status=$?
          combine_status=0
          xml_status=0
          report_status=0
          uv run --frozen --no-sync coverage combine --keep coverage-core.data coverage-front.data >coverage-combine.log 2>&1 || combine_status=$?
          if test "$combine_status" -eq 0; then
            uv run --frozen --no-sync coverage xml -o coverage.xml >coverage-xml.log 2>&1 || xml_status=$?
            uv run --frozen --no-sync coverage report --fail-under=90.1 >coverage-report.log 2>&1 || report_status=$?
          fi
          cat coverage-*.log
          test "$core_status" -eq 0 && test "$front_status" -eq 0 && test "$combine_status" -eq 0 && test "$xml_status" -eq 0 && test "$report_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-tests-*.xml
            coverage-*.log
            coverage-*.data
            backend.json

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --group docs

      - name: Build docs (strict)
        run: make docs-strict

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Rust accelerator
        run: make accel

      - name: Run example scripts
        run: make examples

      - name: Run example tests
        run: uv run pytest tests/test_doc_examples.py -v --tb=short

  install-accel:
    name: Install Accelerator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test install_accel.py script
        run: uv run --frozen --no-sync python scripts/install_accel.py --required 2>&1 | tee install-accel.log

      - name: Verify Rust accelerator loaded
        run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust yes --output backend.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accelerator-install-diagnostics
          path: |
            install-accel.log
            backend.json
