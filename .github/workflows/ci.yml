        run: |
          COVERAGE_FILE=coverage-head.data uv run --frozen --no-sync pytest tests/test_captured_header_flow.py tests/test_live_head_model.py tests/test_selected_history.py tests/test_psk_hard_flow.py tests/test_spline_power.py tests/test_selected_sync_fit.py tests/test_timing_radix4.py tests/test_data_joint_replay.py tests/test_timing_overlap_flow.py tests/test_power_ted_replay.py tests/test_timing_overlap_model.py tests/test_retained_stencil_model.py tests/test_feedback_timing_word.py tests/test_feedback_timing_replay.py tests/test_split_timing_flow.py tests/test_coherent_interleaved.py --cov=nearlink_sdr --cov-report= --cov-fail-under=0 --junitxml=coverage-tests-head.xml --durations=20 >coverage-head.log 2>&1
