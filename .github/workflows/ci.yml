              assert not d["default_RX_changed"] and not any(d["full_RX_gates"].values())
              if split == "development":
                  assert d["fixed_reference_full"] == d["counts"]["p30"]["fixed_full"] == 13
              cost=d["costs"]["30"]
              assert cost["additional_DSP25x18"] == 1
              assert cost["register_state_upper_bits"] == 3247
              assert cost["logical_template_and_constant_bits"] == 2281
              assert cost["known_sync_hold_PI_head_decoder_cycles"] is None
              rows=json.loads((p/"rows.json").read_text())
              for row in rows:
                  if "p30" not in row: continue
                  assert not row["p30"]["success_loss"] and not row["p30"]["added_false_delivery"]
                  assert row["p30"]["partitions_exact"] and row["p30"]["receiver_delta"]["passed"]
              calendars=json.loads((p/"calendars.json").read_text())
              normal=[c for c in calendars if not c["blocked"]]
              assert len(calendars) == 18 and len(normal) == 9
              assert [(c["symbols"],c["clock_Hz"]) for c in normal if c["overflow"]] == [(126,100000000),(126,160000000)]
              assert all(c["overflow"] for c in calendars if c["blocked"])
              assert all(c["remaining_PI_carrier_head_decoder_cycles"] is None for c in calendars)
              assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v
                         for k,v in json.loads((p/"manifest.json").read_text()).items())
          PYCODE
      - name: Verify actual selected-word handoff and explicit missing compute service
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_selected_handoff.py --split development --selected-root receiver-diagnostics/selected-frame --capture-root receiver-diagnostics/capture-fine --fit-root receiver-diagnostics/fit-development --output receiver-diagnostics/handoff-development >handoff-development.log 2>&1 || status=$?
