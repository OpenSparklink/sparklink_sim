  optional-sm3:
    name: Optional SM3 algorithms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --extra sm3
      - name: Require optional dependency and actual Python backend
        run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust no --require-sm3 --output backend.json
      - name: Verify independent HMAC vectors and pairing results
        run: uv run --frozen --no-sync pytest tests/test_crypto.py tests/conformance/test_security.py -v --tb=short --junitxml=sm3.xml 2>&1 | tee sm3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-sm3-results
          path: |
            sm3.xml
            sm3.log
            backend.json

  coverage-shards:
    name: Python Coverage (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        shard: [core, front]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust no --output coverage-backend-${{ matrix.shard }}.json
      - name: Measure core coverage
        if: matrix.shard == 'core'
        run: |
          COVERAGE_FILE=coverage-core.data uv run --frozen --no-sync pytest tests/ --ignore=tests/test_stream_rrc_word.py --ignore=tests/test_selected_word.py --ignore=tests/test_alignment_guard.py --ignore=tests/test_receive_scope.py --ignore=tests/test_rrc_pair_boundary.py --ignore=tests/test_rrc_memory.py --cov=nearlink_sdr --cov-report= --cov-fail-under=0 --junitxml=coverage-tests-core.xml --durations=20 >coverage-core.log 2>&1
      - name: Measure frontend coverage
        if: matrix.shard == 'front'
        run: |
          COVERAGE_FILE=coverage-front.data uv run --frozen --no-sync pytest tests/test_stream_rrc_word.py tests/test_selected_word.py tests/test_alignment_guard.py tests/test_receive_scope.py tests/test_rrc_pair_boundary.py tests/test_rrc_memory.py --cov=nearlink_sdr --cov-report= --cov-fail-under=0 --junitxml=coverage-tests-front.xml --durations=20 >coverage-front.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            coverage-backend-${{ matrix.shard }}.json
            coverage-tests-${{ matrix.shard }}.xml
            coverage-${{ matrix.shard }}.log
            coverage-${{ matrix.shard }}.data

  coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    needs: coverage-shards
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust no --output backend.json
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Combine independent coverage shards
        run: |
          # Same test membership, 120-second shard limit and 90.1% coverage gate.
          # Separate runners avoid CPU contention; missing/failed reports fail closed.
          combine_status=0
          xml_status=0
          report_status=0
          uv run --frozen --no-sync coverage combine --keep coverage-core.data coverage-front.data >coverage-combine.log 2>&1 || combine_status=$?
          if test "$combine_status" -eq 0; then
            uv run --frozen --no-sync coverage xml -o coverage.xml >coverage-xml.log 2>&1 || xml_status=$?
            uv run --frozen --no-sync coverage report --fail-under=90.1 >coverage-report.log 2>&1 || report_status=$?
          fi
          cat coverage-*.log
          test "$combine_status" -eq 0 && test "$xml_status" -eq 0 && test "$report_status" -eq 0
          uv run --frozen --no-sync python scripts/check_test_shards.py coverage-tests-core.xml coverage-tests-front.xml --output coverage-test-budget.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-tests-*.xml
            coverage-test-budget.json
            coverage-*.log
            coverage-*.data
            coverage-backend-*.json
            backend.json

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --group docs

      - name: Build docs (strict)
        run: make docs-strict

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Rust accelerator
        run: make accel

      - name: Run example scripts
        run: make examples

      - name: Run example tests
        run: uv run pytest tests/test_doc_examples.py -v --tb=short

  install-accel:
    name: Install Accelerator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test install_accel.py script
        run: uv run --frozen --no-sync python scripts/install_accel.py --required 2>&1 | tee install-accel.log

      - name: Verify Rust accelerator loaded
        run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust yes --output backend.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accelerator-install-diagnostics
          path: |
            install-accel.log
            backend.json
