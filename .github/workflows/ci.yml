                  assert row["cost"]["within_symbol_compaction_mux2_upper"] == 368
                  assert row["remaining_arithmetic_service_cycles"] is None
                  if row["reference_measured"] is not None:
                      assert row["baseline_raw_reads"] == row["reuse_stats"]["raw_reads"]+row["reuse_stats"]["overlap_words_reused"]
              live=json.loads((p/"live-barriers.json").read_text())
              assert len(live) == 9 and all(not x["full_receiver16MSps"] for x in live)
              assert sum(x["status"] == "initial_source_overflow" for x in live) == 2
              assert all(x["counters"]["functional_resolutions"] == 0 for x in live if "counters" in x)
              assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v
