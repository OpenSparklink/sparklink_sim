              assert d["nodes"]["exact"] and d["nodes"]["cells"] == cells
              assert d["register_increment_bits"] == 104
              assert d["new_DSP"] == d["new_source_RAM"] == d["new_source_ports"] == 0
              assert d["fixed_success_losses"] == d["receiver_rate_gain"] == 0
              assert not d["four_RX_gates_passed"] and not d["new_RF_holdout"]
              assert not d["default_changed"] and not d["synthesis"]
              assert d["complete_latency_cycles"] is None
              if split == "development":
                  assert d["fixed_comparisons"] == 54
                  assert d["resources"] == d["resource_exits"] == 24
                  rows = json.loads((p/"resource-prefixes.json").read_text())
                  assert all(r["source_peak"] <= 512 and r["exact_source_suffix"] for r in rows)
                  assert all(r["actual_epoch_valid"] and r["frame"]["data_crc"] is None for r in rows)
          PYCODE
      - name: Verify retained raw stencil and preserve continuous source failures
        if: ${{ !cancelled() }}
        run: |
          for split in development validation; do
            args=()
            if [ "$split" = validation ]; then
              args=(--freeze receiver-diagnostics/retained-stencil-development/freeze.json)
            fi
            set +e
            PYTHONPATH=src:scripts uv run --frozen --no-sync python -m scripts.model_retained_stencil --output receiver-diagnostics/retained-stencil-$split "${args[@]}" >retained-stencil-$split.log 2>&1
            status=$?
            set -e
            test "$status" = 1
          done
          uv run --frozen --no-sync python - <<'PYCODE'
          import json
          from pathlib import Path
          for split, cases in (("development", 96), ("validation", 112)):
              p = Path("receiver-diagnostics/retained-stencil-" + split)
              d = json.loads((p / "model.json").read_text())
              assert d["nodes"]["exact"] and d["nodes"]["cases"] == cases
              assert not d["nodes"]["word_or_numeric_budget_relaxed"]
              assert d["component_structural_pass"] and d["additional_controller_bits"] == 64
              assert d["new_DSP"] == d["new_source_RAM"] == d["new_source_ports"] == 0
              assert d["fixed_success_losses"] == d["receiver_rate_gain"] == 0
              assert not d["new_RF_holdout"] and not d["four_RX_gates_passed"]
              assert not d["default_changed"] and not d["synthesis"]
              assert d["complete_latency_cycles"] is None
              if split == "development":
                  assert d["fixed_frame_comparisons"] == 54
                  assert d["resources"] == d["resource_exits"] == 24
                  rows = json.loads((p / "resource-prefixes.json").read_text())
                  assert all(r["source_peak"] <= 512 and r["exact_source_suffix"] for r in rows)
                  assert all(r["actual_epoch_valid"] and r["frame"]["data_crc"] is None for r in rows)
          PYCODE
      - name: Upload tests and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.backend }}
          path: |
            report-*.xml
