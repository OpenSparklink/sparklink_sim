          ft4=next(r for r in rows if r["frame_type"] == 4 and r["clock_hz"] == 200000000 and r["variant"] == "pipeline")
          assert ft4["hold_edges"] == 763 < ft4["initial_snapshot"]["margin_edges"] == 1039
