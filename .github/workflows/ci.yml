            coverage-tests-${{ matrix.shard }}.xml
            coverage-${{ matrix.shard }}.log
            coverage-${{ matrix.shard }}.data

  coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    needs: coverage-shards
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust no --output backend.json
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Combine independent coverage shards
        run: |
          # Same test membership, 120-second shard limit and 90.1% coverage gate.
          # Separate runners avoid CPU contention; missing/failed reports fail closed.
          combine_status=0
          xml_status=0
          report_status=0
          uv run --frozen --no-sync coverage combine --keep coverage-core.data coverage-front.data coverage-rrc.data coverage-head.data coverage-replay.data coverage-handoff.data coverage-word.data >coverage-combine.log 2>&1 || combine_status=$?
          if test "$combine_status" -eq 0; then
            uv run --frozen --no-sync coverage xml -o coverage.xml >coverage-xml.log 2>&1 || xml_status=$?
            uv run --frozen --no-sync coverage report --fail-under=90.1 >coverage-report.log 2>&1 || report_status=$?
          fi
          cat coverage-*.log
          test "$combine_status" -eq 0 && test "$xml_status" -eq 0 && test "$report_status" -eq 0
          uv run --frozen --no-sync python scripts/check_test_shards.py coverage-tests-core.xml coverage-tests-front.xml coverage-tests-rrc.xml coverage-tests-head.xml coverage-tests-replay.xml coverage-tests-handoff.xml coverage-tests-word.xml --output coverage-test-budget.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-tests-*.xml
            coverage-test-budget.json
            coverage-*.log
            coverage-*.data
            coverage-backend-*.json
            backend.json

