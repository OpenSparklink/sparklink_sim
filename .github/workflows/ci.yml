                  assert cost["new_controller_state_bits"] == 2090 and cost["extra_hold_controller_bits"] == 0
                  assert c["complete_latency_cycles"] is None
              assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v for k,v in json.loads((p/"manifest.json").read_text()).items())
          rows=json.loads(Path("receiver-diagnostics/hold-pipeline-development/periodic-prefixes.json").read_text())
