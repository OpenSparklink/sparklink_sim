              if split == "development":
                  assert d["fixed_baseline_full"] == d["fixed_replay_full"] == 13
                  assert 0 < d["measured_same_rows_reuse_raw_reads"] < d["measured_reference_raw_reads"]
              rows=json.loads((p/"rows.json").read_text())+json.loads((p/"fixed-regressions.json").read_text())
              for row in rows:
