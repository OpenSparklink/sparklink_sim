              assert d["node"]["cost"]["alignment_RNE_shifters21"] == 8
              assert d["node"]["cost"]["alignment_RNE_shifters19"] == 0
              assert d["provisional_node_resource_gate"]
              assert d["node"]["cost"]["DSP25x18"] == 6
              assert d["node"]["cost"]["pipeline_register_bound_bits"] == 2057
              assert not d["default_RX_changed"] and not any(d["full_RX_gates"].values())
              if split == "validation":
                  assert d["RF_evaluated"] == dev["eligible"]
                  assert d["RF_validation_skipped_due_rejection"] != dev["eligible"]
              calendars = json.loads((p / "calendars.json").read_text())
              assert len(calendars) == 27
              assert sum(r["overflow"] is not None for r in calendars) == 7
              assert all(r["initial_fit_PI_head_decoder_cycles"] is None for r in calendars)
              assert all(hashlib.sha256((p/k).read_bytes()).hexdigest() == v
                         for k,v in json.loads((p / "manifest.json").read_text()).items())
          PYCODE
      - name: Verify finite known-sync initialization and preserve source overflow
        if: always()
        run: |
          status=0
          uv run --frozen --no-sync python scripts/model_sync_initial_fit.py --split development --selected-root receiver-diagnostics/selected-frame --capture-root receiver-diagnostics/capture-fine --word-root receiver-diagnostics/interpolation-development --output receiver-diagnostics/fit-development >fit-development.log 2>&1 || status=$?
          test "$status" -eq 1
