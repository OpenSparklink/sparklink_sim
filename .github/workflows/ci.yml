name: CI

on:
  push:
    branches: [master, codex/psk-timing-tracking]
  workflow_dispatch:
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: |
          make lint
          uv run --frozen --no-sync ruff check scripts/model_head_prefetch.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_head_prefetch.py src/nearlink_sdr/sim/head_prefetched_capture.py tests/test_head_prefetched_capture.py tests/test_model_head_prefetch.py
          uv run --frozen --no-sync ruff check scripts/model_finite_coherent.py scripts/model_interleaved_coherent.py
          uv run --frozen --no-sync ruff check scripts/check_test_shards.py
          uv run --frozen --no-sync ruff check scripts/model_selected_handoff.py
          uv run --frozen --no-sync ruff check scripts/model_timing_words.py
          uv run --frozen --no-sync ruff check scripts/model_timing_handoff.py
          uv run --frozen --no-sync ruff check scripts/model_normalization_words.py
          uv run --frozen --no-sync ruff check scripts/model_normalization_overlap.py
          uv run --frozen --no-sync ruff check scripts/model_timing_divider.py
          uv run --frozen --no-sync ruff check scripts/model_control_polar.py
          uv run --frozen --no-sync ruff check scripts/check_b1_length.py
          uv run --frozen --no-sync ruff check scripts/check_frozen_corpora.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/check_frozen_corpora.py tests/test_legacy_corpora.py
          uv run --frozen --no-sync ruff check scripts/model_header_geometry.py
          uv run --frozen --no-sync ruff check scripts/model_header_words.py
          uv run --frozen --no-sync ruff check scripts/model_hard_header.py
          uv run --frozen --no-sync ruff check scripts/model_live_head.py scripts/model_timing_radix4.py
          uv run --frozen --no-sync ruff check scripts/model_data_joint.py
          uv run --frozen --no-sync ruff check scripts/model_timing_overlap.py
          uv run --frozen --no-sync ruff check scripts/model_retained_stencil.py
          uv run --frozen --no-sync ruff check scripts/model_rrc_bridge.py
          uv run --frozen --no-sync ruff check scripts/model_raw_gate_join.py
          uv run --frozen --no-sync ruff check scripts/model_rank_serial.py
          uv run --frozen --no-sync ruff check scripts/model_coarse_ingress.py
          uv run --frozen --no-sync ruff check scripts/model_spline_gauss.py
          uv run --frozen --no-sync ruff check scripts/model_fine_symbols.py
          uv run --frozen --no-sync ruff check scripts/model_coarse_capture.py
          uv run --frozen --no-sync ruff check scripts/model_captured_frame.py
          uv run --frozen --no-sync ruff check scripts/model_retired_capture.py
          uv run --frozen --no-sync ruff check scripts/model_captured_header.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_captured_header.py src/nearlink_sdr/sim/captured_header_flow.py tests/test_captured_header_flow.py
          PYTHONPATH=.:src:scripts uv run --frozen --no-sync python -m scripts.model_captured_header --help
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_retired_capture.py tests/test_retired_capture.py tests/test_retired_capture_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 tests/test_capture_coherence_observation.py
          PYTHONPATH=.:src:scripts uv run --frozen --no-sync python -m scripts.model_retired_capture --help
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_captured_frame.py src/nearlink_sdr/sim/fine_selection.py src/nearlink_sdr/sim/capture_frame.py tests/captured_frame_reference.py tests/test_fine_selection.py tests/test_captured_frame_owner.py tests/test_capture_frame.py tests/test_capture_frame_failures.py tests/test_capture_frame_resources.py tests/test_captured_frame_model.py
          PYTHONPATH=.:src:scripts uv run --frozen --no-sync python -m scripts.model_captured_frame --help
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_coarse_capture.py src/nearlink_sdr/sim/coarse_capture_source.py tests/coarse_capture_reference.py tests/test_coarse_capture_source.py tests/test_coarse_capture_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_fine_symbols.py src/nearlink_sdr/sim/fine_symbol_pipeline.py tests/test_fine_symbol_pipeline.py tests/test_fine_symbols_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_spline_gauss.py tests/test_spline_gauss.py tests/test_spline_gauss_model.py
          PYTHONPATH=.:src:scripts uv run --frozen --no-sync python -m scripts.model_spline_gauss --help
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_coarse_ingress.py src/nearlink_sdr/sim/coarse_ingress.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_rank_serial.py src/nearlink_sdr/sim/rank_serial.py tests/test_rank_serial.py tests/test_rank_core.py tests/test_rank_serial_model.py tests/test_coarse_ingress.py tests/test_coarse_ingress_model.py
          uv run --frozen --no-sync ruff check scripts/model_scaled_maximum.py
          uv run --frozen --no-sync ruff check scripts/model_banked_scaled.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 \
            scripts/model_banked_scaled.py \
            src/nearlink_sdr/phy/banked_words.py \
            src/nearlink_sdr/sim/scaled_native.py \
            src/nearlink_sdr/sim/banked_scaled_core.py \
            tests/test_banked_words.py \
            tests/test_scaled_native.py \
            tests/test_banked_scaled_core.py \
            tests/test_banked_scaled_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_scaled_maximum.py src/nearlink_sdr/phy/acquisition_maximum.py src/nearlink_sdr/sim/maximum_flow.py tests/test_acquisition_maximum.py tests/test_maximum_flow.py tests/test_scaled_maximum_model.py tests/maximum_reference.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_raw_gate_join.py src/nearlink_sdr/sim/raw_gate_join.py tests/test_raw_gate_join.py tests/test_raw_gate_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_rrc_bridge.py src/nearlink_sdr/phy/rrc_bridge.py src/nearlink_sdr/sim/rrc_bridge_flow.py tests/test_rrc_bridge.py tests/test_rrc_bridge_flow.py tests/test_stream_rrc_bridge.py tests/test_rrc_bridge_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 src/nearlink_sdr/sim/feedback_timing_word.py src/nearlink_sdr/sim/feedback_timing_replay.py src/nearlink_sdr/sim/split_timing_flow.py src/nearlink_sdr/sim/split_sampling_replay.py src/nearlink_sdr/sim/packed_head_replay.py src/nearlink_sdr/sim/initialized_frame_replay.py tests/test_feedback_timing_word.py tests/test_feedback_timing_replay.py tests/test_split_timing_flow.py tests/test_split_sampling_replay.py tests/test_packed_head_replay.py tests/test_initialized_frame_replay.py tests/split_calendar.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_retained_stencil.py src/nearlink_sdr/sim/retained_stencil_replay.py tests/stencil_reference.py tests/test_retained_stencil_replay.py tests/test_retained_stencil_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_timing_overlap.py src/nearlink_sdr/sim/timing_overlap_flow.py src/nearlink_sdr/sim/power_ted_replay.py tests/timing_overlap_reference.py tests/test_timing_overlap_flow.py tests/test_power_ted_replay.py tests/test_timing_overlap_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_data_joint.py src/nearlink_sdr/sim/data_joint_replay.py tests/test_data_joint_replay.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_timing_radix4.py tests/test_timing_radix4.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_live_head.py src/nearlink_sdr/phy/word_head_rx.py src/nearlink_sdr/sim/head_word_replay.py tests/test_head_word_replay.py tests/test_live_head_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_hard_header.py src/nearlink_sdr/phy/psk_hard_word.py src/nearlink_sdr/sim/psk_hard_flow.py tests/test_psk_hard_word.py tests/test_psk_hard_flow.py tests/test_hard_header_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_header_words.py src/nearlink_sdr/sim/header_word_flow.py tests/test_header_word_flow.py tests/test_header_word_receive.py tests/test_header_word_standard.py tests/test_header_word_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_header_geometry.py tests/test_header_geometry_flow.py src/nearlink_sdr/sim/header_geometry_flow.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/check_b1_length.py tests/test_control_length.py tests/test_b1_wire_length.py src/nearlink_sdr/phy/control_length.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_control_polar.py src/nearlink_sdr/phy/control_polar_word.py src/nearlink_sdr/sim/control_polar_flow.py tests/test_control_polar_word.py tests/test_control_polar_flow.py tests/test_control_polar_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_timing_divider.py tests/test_timing_divider_prefix.py tests/test_timing_divider_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_normalization_overlap.py src/nearlink_sdr/sim/normalization_pipeline.py src/nearlink_sdr/sim/overlapped_normalization_replay.py tests/test_normalization_pipeline.py tests/test_overlapped_normalization_replay.py tests/test_normalization_overlap_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_normalization_words.py src/nearlink_sdr/phy/normalization_word.py src/nearlink_sdr/phy/normalized_word_rx.py src/nearlink_sdr/sim/normalization_word_flow.py src/nearlink_sdr/sim/normalized_word_replay.py tests/normalization_reference.py tests/test_normalization_word.py tests/test_normalization_word_flow.py tests/test_normalized_word_replay.py tests/test_normalization_word_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 tests/test_timing_handoff_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 src/nearlink_sdr/sim/timing_query_flow.py src/nearlink_sdr/sim/finite_timing_replay.py tests/test_timing_query_flow.py tests/test_finite_timing_replay.py scripts/model_timing_handoff.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_timing_words.py src/nearlink_sdr/phy/timing_word.py src/nearlink_sdr/phy/timing_word_rx.py src/nearlink_sdr/sim/timing_word_flow.py tests/test_timing_word.py tests/test_timing_word_flow.py tests/test_timing_word_rx.py tests/test_timing_word_model.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_selected_handoff.py tests/test_selected_frame_replay.py tests/test_interpolant_rx.py src/nearlink_sdr/phy/interpolant_rx.py src/nearlink_sdr/sim/selected_frame_replay.py
          uv run --frozen --no-sync ruff check scripts/model_sync_initial_fit.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_sync_initial_fit.py tests/test_sync_fit_word.py tests/test_sync_fit_flow.py tests/test_selected_sync_fit.py tests/test_initial_sync_fit_flow.py src/nearlink_sdr/phy/sync_fit_word.py src/nearlink_sdr/sim/sync_fit_flow.py src/nearlink_sdr/sim/initial_sync_fit_flow.py
          uv run --frozen --no-sync ruff check scripts/model_initial_reuse.py
          uv run --frozen --no-sync ruff check scripts/model_alignment_guard.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 scripts/model_alignment_guard.py tests/test_alignment_guard.py
          uv run --frozen --no-sync ruff check scripts/model_interpolation_word.py scripts/model_spline_power.py scripts/model_spline_geometry.py scripts/model_score_words.py scripts/model_capture_tail.py scripts/model_selected_frame.py scripts/model_sliding_history.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 \
            src/nearlink_sdr/sim/word_arithmetic.py \
            src/nearlink_sdr/sim/score_word_runtime.py \
            src/nearlink_sdr/sim/spline_score.py \
            src/nearlink_sdr/sim/capture_fine.py \
            src/nearlink_sdr/sim/capture_transport.py \
            src/nearlink_sdr/sim/capture_tail.py \
            tests/test_word_arithmetic.py \
            tests/test_score_word_runtime.py \
            tests/test_capture_tail.py \
            scripts/model_score_words.py \
            scripts/model_capture_tail.py \
            src/nearlink_sdr/phy/selected_rx.py \
            tests/test_selected_rx.py \
            scripts/model_selected_frame.py \
            src/nearlink_sdr/phy/retained_history.py \
            src/nearlink_sdr/sim/receive_history.py \
            tests/test_retained_history.py \
            tests/test_selected_history.py \
            tests/test_receive_history.py \
            scripts/model_sliding_history.py \
            src/nearlink_sdr/phy/interpolation_word.py \
            src/nearlink_sdr/phy/selected_word.py \
            src/nearlink_sdr/sim/interpolation_flow.py \
            tests/test_interpolation_word.py \
            tests/test_interpolation_flow.py \
            tests/test_selected_word.py \
            scripts/model_interpolation_word.py
          uv run --frozen --no-sync ruff check --isolated --select E501 --line-length 100 \
            src/nearlink_sdr/phy/initial_interpolant.py \
            src/nearlink_sdr/sim/initial_interpolant_flow.py \
            tests/test_initial_interpolant.py tests/test_initial_interpolant_flow.py \
            scripts/model_initial_reuse.py
      - name: Check actual module CLI environments before long regressions
        run: |
          uv run --frozen --no-sync python - <<'PYCODE'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          text = Path(".github/workflows/ci.yml").read_text()
          entries = sorted(set(re.findall(
              r"^\s*PYTHONPATH=(\S+).*?-m (scripts\.\w+)\b", text, flags=re.M)))
          assert entries, "No actual module entrypoints were checked"
          for path, module in entries:
              subprocess.run([sys.executable, "-m", module, "--help"],
                             env=dict(os.environ, PYTHONPATH=path), check=True)
              print(module, "actual PYTHONPATH", path, flush=True)
          PYCODE


  rust:
    name: Rust Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cd rust && cargo fmt --check

      - name: Clippy lint
        run: cd rust && cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cd rust && cargo test

  unit-shards:
    name: Unit (${{ matrix.backend }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        backend: [python, rust]
        shard: [core, front, rrc, head, replay, handoff, word]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.backend == 'rust'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --group accel
      - name: Build Rust accelerator
        if: matrix.backend == 'rust'
        run: uv run --frozen --no-sync maturin develop --manifest-path rust/Cargo.toml --locked --release
      - name: Verify actual shard backend
        run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust ${{ matrix.backend == 'rust' && 'yes' || 'no' }} --output backend-${{ matrix.shard }}.json
      - name: Run one complete shard without a competing pytest process
        env:
          SPARKLINK_TEST_DIAGNOSTICS: receiver-diagnostics/unit-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}
        run: |
          rrc=(tests/test_stream_rrc_word.py tests/test_capture_coherence_observation.py)
          replay=(tests/test_retained_stencil_replay.py tests/test_split_sampling_replay.py tests/test_packed_head_replay.py tests/test_capture_frame.py tests/test_coherent_captured_frame.py)
          head=(tests/test_captured_header_flow.py tests/test_live_head_model.py tests/test_selected_history.py tests/test_psk_hard_flow.py tests/test_spline_power.py tests/test_selected_sync_fit.py tests/test_timing_radix4.py tests/test_data_joint_replay.py tests/test_timing_overlap_flow.py tests/test_power_ted_replay.py tests/test_timing_overlap_model.py tests/test_retained_stencil_model.py tests/test_feedback_timing_word.py tests/test_feedback_timing_replay.py tests/test_split_timing_flow.py tests/test_coherent_interleaved.py)
          front=(tests/test_overlapped_normalization_replay.py tests/test_normalized_word_replay.py tests/test_normalization_overlap_model.py tests/test_pipelined_timing_replay.py tests/test_normalization_word.py tests/test_finite_timing_replay.py tests/test_timing_divider_prefix.py tests/test_timing_divider_model.py tests/test_selected_word.py tests/test_alignment_guard.py tests/test_receive_scope.py tests/test_rrc_pair_boundary.py tests/test_rrc_memory.py tests/test_retired_capture.py)
          handoff=(tests/test_initialized_frame_replay.py tests/test_head_word_replay.py tests/test_capture_frame_failures.py tests/test_queued_retirement.py tests/test_stream_rrc_full14_boundaries.py)
          word=(tests/test_initialized_captured_frame.py tests/test_spline_flow.py tests/test_timing_word_rx.py tests/test_selected_frame_replay.py tests/test_header_word_flow.py tests/test_rrc_pair_flow.py tests/test_carrier_numeric_validation.py tests/test_capture_fine.py tests/test_uniform_spline.py tests/test_header_word_standard.py tests/test_selected_rx.py tests/test_normalization_word_flow.py tests/test_timing_word_flow.py tests/test_score_word_runtime.py tests/test_acquisition_flow.py tests/test_acquisition_scaled.py tests/test_acquisition_bank.py tests/test_rank_serial.py tests/test_rank_core.py tests/test_rank_serial_model.py tests/test_coarse_ingress.py tests/test_coarse_ingress_model.py tests/test_coarse_capture_source.py tests/test_coarse_capture_model.py tests/test_capture_frame_resources.py)
          if [ "$SHARD" = core ]; then
            paths=(tests/)
            for path in "${rrc[@]}"; do paths+=("--ignore=$path"); done
            for path in "${replay[@]}"; do paths+=("--ignore=$path"); done
            for path in "${front[@]}"; do paths+=("--ignore=$path"); done
            for path in "${head[@]}"; do paths+=("--ignore=$path"); done
            for path in "${handoff[@]}"; do paths+=("--ignore=$path"); done
            for path in "${word[@]}"; do paths+=("--ignore=$path"); done
          elif [ "$SHARD" = rrc ]; then
            paths=("${rrc[@]}")
          elif [ "$SHARD" = replay ]; then
            paths=("${replay[@]}")
          elif [ "$SHARD" = head ]; then
            paths=("${head[@]}")
          elif [ "$SHARD" = handoff ]; then
            paths=("${handoff[@]}")
          elif [ "$SHARD" = word ]; then
            paths=("${word[@]}")
          else
            paths=("${front[@]}")
          fi
          uv run --frozen --no-sync pytest "${paths[@]}" -v --tb=short --junitxml=report-$SHARD.xml --durations=20 >test-$SHARD.log 2>&1
      - name: Check actual unit shard duration even on test failure
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          shard = os.environ["SHARD"]
          root = ET.parse(f"report-{shard}.xml")
          suites = list(root.iter("testsuite"))
          assert len(suites) == 1
          data = suites[0].attrib
          cases = len(list(root.iter("testcase")))
          passed = (cases == int(data["tests"]) > 0
                    and data["failures"] == data["errors"] == "0"
                    and 0 <= float(data["time"]) < 120)
          result = dict(shard=shard, suite=data, cases=cases, passed=passed,
                        walltime_budget_seconds=120, receiver_acceptance=False)
          Path(f"unit-budget-{shard}.json").write_text(json.dumps(result, indent=2) + "\n")
          assert passed, result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.backend }}-${{ matrix.shard }}
          path: |
            backend-${{ matrix.shard }}.json
            report-${{ matrix.shard }}.xml
            test-${{ matrix.shard }}.log
            unit-budget-${{ matrix.shard }}.json
            receiver-diagnostics/

  test:
    name: Test (${{ matrix.backend }})
    needs: unit-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.backend == 'rust'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install locked dependencies
        run: uv sync --frozen --group accel
      - name: Build Rust accelerator
        if: matrix.backend == 'rust'
        run: uv run --frozen --no-sync maturin develop --manifest-path rust/Cargo.toml --locked --release 2>&1 | tee build.log
      - name: Verify actual backend
        run: uv run --frozen --no-sync python scripts/check_receiver_backend.py --expected-rust ${{ matrix.backend == 'rust' && 'yes' || 'no' }} --output backend.json
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-${{ matrix.backend }}-*
          merge-multiple: true
      - name: Verify all seven actual unit shards and unchanged time budget
        run: |
          cat test-core.log test-front.log test-rrc.log test-head.log test-replay.log test-handoff.log test-word.log
          uv run --frozen --no-sync python - <<'PY'
          import json
          base = json.load(open("backend.json"))
          for shard in ("core", "front", "rrc", "head", "replay", "handoff", "word"):
              actual = json.load(open(f"backend-{shard}.json"))
              assert json.load(open(f"unit-budget-{shard}.json"))["passed"]
              for key in ("commit", "polar_rust", "crc_rust", "stream_timing_rust", "integer_sync_rust"):
